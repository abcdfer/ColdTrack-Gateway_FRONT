name: frontend
on:
  push:
    branches: [dev, develop, main, codex/coldtrack-web, 'feature/**']
  pull_request:
    branches: [dev, develop, main, codex/coldtrack-web, codex/frontend-tema-claro]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
